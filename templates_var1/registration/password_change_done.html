{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="success-message">
        <h1>Пароль успешно изменён!</h1>
        <p>Ваш пароль был успешно изменён.</p>
        <a href="{% url 'project_list' %}" class="btn btn-primary">На главную</a>
        <a href="{% url 'user_profile' user.id %}" class="btn btn-secondary">В профиль</a>
    </div>
</div>

<style>
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
    }
    .success-message {
        background: #d4edda;
        border: 1px solid #c3e6cb;
        border-radius: 8px;
        padding: 30px;
    }
    h1 {
        color: #155724;
        margin-bottom: 20px;
    }
    .btn {
        padding: 10px 24px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin: 10px 5px;
    }
    .btn-primary {
        background: #4a5568;
        color: white;
    }
    .btn-secondary {
        background: #e2e8f0;
        color: #333;
    }
</style>
{% endblock %}

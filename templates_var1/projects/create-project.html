{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>{% if is_edit %}Редактирование проекта{% else %}Создание проекта{% endif %}</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_name">Название проекта:</label>
            <input type="text" name="name" id="id_name" class="form-control" value="{{ form.name.value|default:'' }}" required>
        </div>
        
        <div class="form-group">
            <label for="id_description">Описание:</label>
            <textarea name="description" id="id_description" class="form-control" rows="5">{{ form.description.value|default:'' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="id_github_url">GitHub (ссылка):</label>
            <input type="url" name="github_url" id="id_github_url" class="form-control" value="{{ form.github_url.value|default:'' }}" placeholder="https://github.com/username/repo">
        </div>
        
        <div class="form-group">
            <label for="id_status">Статус:</label>
            <select name="status" id="id_status" class="form-control">
                <option value="open" {% if form.status.value == 'open' %}selected{% endif %}>Открыт</option>
                <option value="closed" {% if form.status.value == 'closed' %}selected{% endif %}>Закрыт</option>
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if is_edit %}Сохранить изменения{% else %}Создать проект{% endif %}</button>
            {% if is_edit and project %}
                <a href="{% url 'project_detail' project.id %}" class="btn btn-secondary">Отмена</a>
            {% else %}
                <a href="{% url 'project_list' %}" class="btn btn-secondary">Отмена</a>
            {% endif %}
        </div>
    </form>
</div>

<style>
    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    h1 {
        margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 25px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }
    .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
    }
    textarea.form-control {
        resize: vertical;
        min-height: 120px;
    }
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }
    .btn {
        padding: 10px 24px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }
    .btn-primary {
        background: #4a5568;
        color: white;
    }
    .btn-secondary {
        background: #e2e8f0;
        color: #333;
    }
</style>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Редактирование профиля</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Имя:</label>
            {{ form.name }}
        </div>
        
        <div class="form-group">
            <label>Фамилия:</label>
            {{ form.surname }}
        </div>
        
        <div class="form-group">
            <label>Телефон:</label>
            {{ form.phone }}
        </div>
        
        <div class="form-group">
            <label>GitHub:</label>
            {{ form.github_url }}
        </div>
        
        <div class="form-group">
            <label>Аватар (URL):</label>
            {{ form.avatar }}
        </div>
        
        <div class="form-group">
            <label>О себе:</label>
            {{ form.about }}
        </div>
        
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'user_profile' user.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<style>
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    textarea { min-height: 100px; }
    .btn-primary { background: #4a5568; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-secondary { background: #e2e8f0; color: #333; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-left: 10px; }
</style>
{% endblock %}
